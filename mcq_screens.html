<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Online Assessment Platform</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2463eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .custom-radio:checked + div {
            border-color: #2463eb;
            background-color: rgba(36, 99, 235, 0.04);
        }
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 8px;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen font-display text-[#111318]">
<!-- Fixed Top Navbar -->
<header class="fixed top-0 left-0 right-0 h-16 bg-white border-b border-gray-200 z-50 flex items-center justify-between px-6 lg:px-12">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-3xl">terminal</span>
<h1 class="text-lg font-bold tracking-tight">Computer Science Fundamentals</h1>
</div>
<div class="flex items-center gap-2 px-4 py-2 bg-red-50 rounded-lg border border-red-100">
<span class="material-symbols-outlined text-red-600 text-xl">timer</span>
<span class="text-red-600 font-mono font-bold text-lg">01:45:22</span>
</div>
<button class="bg-primary hover:bg-primary/90 text-white px-6 py-2 rounded-lg font-bold transition-colors">
            Submit Exam
        </button>
</header>
<!-- Main Content Wrapper -->
<main class="pt-24 pb-24 px-6 lg:px-12 max-w-[1440px] mx-auto flex flex-col lg:flex-row gap-8">
<!-- Left Side: Question Area (70%) -->
<section class="lg:w-[70%] flex flex-col gap-6">
<div class="bg-white border border-gray-200 rounded-xl p-8 shadow-sm">
<div class="flex items-center justify-between mb-6">
<span class="bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase">Question 12 of 50</span>
<div class="flex items-center gap-2 text-gray-400">
<span class="material-symbols-outlined text-sm">info</span>
<span class="text-xs">Single Choice Question</span>
</div>
</div>
<h2 class="text-xl lg:text-2xl font-semibold leading-snug mb-8">
                    What is the time complexity of a binary search algorithm in the average and worst cases?
                </h2>
<div class="space-y-4">
<!-- Option A -->
<label class="relative block cursor-pointer group">
<input class="peer hidden custom-radio" name="question-12" type="radio"/>
<div class="flex items-center gap-4 p-5 rounded-xl border-2 border-gray-100 bg-gray-50/30 transition-all peer-checked:border-primary peer-checked:bg-primary/5 hover:border-gray-200">
<div class="size-6 flex items-center justify-center rounded-full border-2 border-gray-300 bg-white peer-checked:border-primary peer-checked:bg-primary transition-all">
<span class="text-xs font-bold text-gray-500 peer-checked:text-white uppercase">A</span>
</div>
<span class="text-base font-medium text-gray-700">O(n) - Linear time</span>
</div>
</label>
<!-- Option B -->
<label class="relative block cursor-pointer group">
<input checked="" class="peer hidden custom-radio" name="question-12" type="radio"/>
<div class="flex items-center gap-4 p-5 rounded-xl border-2 border-primary bg-primary/5 transition-all hover:border-primary">
<div class="size-6 flex items-center justify-center rounded-full border-2 border-primary bg-primary transition-all">
<span class="text-xs font-bold text-white uppercase">B</span>
</div>
<span class="text-base font-medium text-gray-700">O(log n) - Logarithmic time</span>
</div>
</label>
<!-- Option C -->
<label class="relative block cursor-pointer group">
<input class="peer hidden custom-radio" name="question-12" type="radio"/>
<div class="flex items-center gap-4 p-5 rounded-xl border-2 border-gray-100 bg-gray-50/30 transition-all peer-checked:border-primary peer-checked:bg-primary/5 hover:border-gray-200">
<div class="size-6 flex items-center justify-center rounded-full border-2 border-gray-300 bg-white peer-checked:border-primary peer-checked:bg-primary transition-all">
<span class="text-xs font-bold text-gray-500 uppercase">C</span>
</div>
<span class="text-base font-medium text-gray-700">O(n log n) - Linearithmic time</span>
</div>
</label>
<!-- Option D -->
<label class="relative block cursor-pointer group">
<input class="peer hidden custom-radio" name="question-12" type="radio"/>
<div class="flex items-center gap-4 p-5 rounded-xl border-2 border-gray-100 bg-gray-50/30 transition-all peer-checked:border-primary peer-checked:bg-primary/5 hover:border-gray-200">
<div class="size-6 flex items-center justify-center rounded-full border-2 border-gray-300 bg-white peer-checked:border-primary peer-checked:bg-primary transition-all">
<span class="text-xs font-bold text-gray-500 uppercase">D</span>
</div>
<span class="text-base font-medium text-gray-700">O(1) - Constant time</span>
</div>
</label>
</div>
</div>
</section>
<!-- Right Side: Question Palette (30%) -->
<aside class="lg:w-[30%] space-y-6">
<div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm sticky top-24">
<h3 class="text-sm font-bold uppercase tracking-widest text-gray-500 mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-lg">grid_view</span>
                    Question Palette
                </h3>
<!-- Legend -->
<div class="grid grid-cols-2 gap-y-3 gap-x-4 mb-8 text-xs font-medium text-gray-600">
<div class="flex items-center gap-2">
<div class="size-4 bg-primary rounded"></div>
<span>Answered</span>
</div>
<div class="flex items-center gap-2">
<div class="size-4 bg-yellow-400 rounded"></div>
<span>Review</span>
</div>
<div class="flex items-center gap-2">
<div class="size-4 bg-white border border-primary rounded ring-1 ring-primary/30"></div>
<span>Current</span>
</div>
<div class="flex items-center gap-2">
<div class="size-4 bg-gray-200 rounded"></div>
<span>Not Visited</span>
</div>
</div>
<!-- Palette Grid -->
<div class="palette-grid">
<!-- Numbers 1-11: Answered (Primary Blue) -->
<button class="size-10 flex items-center justify-center rounded bg-primary text-white text-sm font-bold">1</button>
<button class="size-10 flex items-center justify-center rounded bg-primary text-white text-sm font-bold">2</button>
<button class="size-10 flex items-center justify-center rounded bg-primary text-white text-sm font-bold">3</button>
<button class="size-10 flex items-center justify-center rounded bg-primary text-white text-sm font-bold">4</button>
<!-- 5: Marked for review -->
<button class="size-10 flex items-center justify-center rounded bg-yellow-400 text-white text-sm font-bold">5</button>
<button class="size-10 flex items-center justify-center rounded bg-primary text-white text-sm font-bold">6</button>
<button class="size-10 flex items-center justify-center rounded bg-primary text-white text-sm font-bold">7</button>
<!-- 8: Marked for review -->
<button class="size-10 flex items-center justify-center rounded bg-yellow-400 text-white text-sm font-bold">8</button>
<button class="size-10 flex items-center justify-center rounded bg-primary text-white text-sm font-bold">9</button>
<button class="size-10 flex items-center justify-center rounded bg-primary text-white text-sm font-bold">10</button>
<button class="size-10 flex items-center justify-center rounded bg-primary text-white text-sm font-bold">11</button>
<!-- 12: Current Visited (White with Border) -->
<button class="size-10 flex items-center justify-center rounded border-2 border-primary bg-white text-primary text-sm font-black ring-2 ring-primary/10">12</button>
<!-- 13-50: Not Visited (Gray) -->
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">13</button>
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">14</button>
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">15</button>
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">16</button>
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">17</button>
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">18</button>
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">19</button>
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">20</button>
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">21</button>
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">22</button>
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">23</button>
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">24</button>
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">25</button>
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">26</button>
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">27</button>
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">28</button>
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">29</button>
<button class="size-10 flex items-center justify-center rounded bg-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-300">30</button>
</div>
<div class="mt-8 pt-6 border-t border-gray-100 flex items-center justify-between text-xs font-semibold text-gray-400">
<span>Progress: 22% Completed</span>
<span>11/50 Answered</span>
</div>
<div class="w-full h-1.5 bg-gray-100 rounded-full mt-2 overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 22%"></div>
</div>
</div>
</aside>
</main>
<!-- Bottom Navigation Footer -->
<footer class="fixed bottom-0 left-0 right-0 h-20 bg-white border-t border-gray-200 px-6 lg:px-12 flex items-center justify-between z-50">
<button class="flex items-center gap-2 px-6 py-2.5 rounded-lg border border-gray-200 text-gray-600 font-semibold hover:bg-gray-50 transition-colors">
<span class="material-symbols-outlined">chevron_left</span>
            Previous
        </button>
<div class="flex items-center gap-4">
<button class="flex items-center gap-2 px-6 py-2.5 rounded-lg border border-yellow-400 text-yellow-700 font-semibold hover:bg-yellow-50 transition-colors">
<span class="material-symbols-outlined">bookmark</span>
                Mark for Review
            </button>
<button class="flex items-center gap-2 px-8 py-2.5 rounded-lg bg-primary text-white font-bold hover:bg-primary/90 transition-colors">
                Save &amp; Next
                <span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</footer>
</body></html>
